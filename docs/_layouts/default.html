<!DOCTYPE html>
<html class="no-js" lang="{{ site.lang | default: "en-US" }}" dir="auto">
<head>
	<meta charset='utf-8'>
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge">

	<script>(function(html){html.className = html.className.replace(/\bno-js\b/,'js')})(document.documentElement);</script>
	<link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

	{% seo %}
</head>
<body>
	<div id="{{ page.id }}" class="page-container">
		<header class="page-header">
			<div class="inner">
				<nav class="page-navigation">
					<ul>
						<li><a href="{{ '/about/' | relative_url }}">About</a></li>
						<li><a href="{{ '/features/' | relative_url }}">Features</a></li>
						<li><a href="{{ '/docs/' | relative_url }}">Docs</a></li>
						<li><a href="{{ site.repository_url }}">Code</a></li>
						<li><a href="{{ site.url }}/applied-content-forms/">Home</a></li>
					</ul>
				</nav>
				{% if page.title %}
				<p class="page-title">
					<a href="./">Applied Content Forms</a>
				</p>
				{% else %}
				<h1 class="page-title">Applied Content Forms</h1>
				{% endif %}
			</div>
		</header>

		<main class="page-content">
			<div class="inner">
				{% if page.title %}
				<h1>{{ page.title }}</h1>
				{% endif %}
				{{ content }}
			</div>
		</main>

		<footer class="page-footer">
			<div class="inner">
				{% if site.show_downloads %}
				<ul class="download-links">
					<li>
						<a href="{{ site.github.zip_url }}" id="download-zip" class="button"><span>Download .zip</span></a>
					</li>
					<li>
						<a href="{{ site.github.tar_url }}" id="download-tar-gz" class="button"><span>Download .tar.gz</span></a>
					</li>
				</ul>
				{% endif %}
			</div>
		</footer>
	</div>
</body>
</html>
