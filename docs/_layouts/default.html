<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
	<meta charset='utf-8'>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
	<!--[if lt IE 9]>
	<script src="//html5shiv.googlecode.com/svn/trunk/html5.js"></script>
	<![endif]-->

	{% seo %}
</head>
<body>
	<div id="{{ page.id }}" class="page-container">
		<header class="page-header">
			<div class="inner">
				<nav class="page-navigation">
					<ul>
						<li><a href="plugin-overview.html">About</a></li>
						<li><a href="features.html">Features</a></li>
						<li><a href="docs.html">Docs</a></li>
						<li><a href="https://github.com/ControlledChaos/applied-content-forms">Code</a></li>
						<li><a href="{{ site.url }}">Home</a></li>
					</ul>
				</nav>
				{% if page.title %}
				<p class="page-title">
					<a href="./">Applied Content Forms</a>
				</p>
				{% else %}
				<h1 class="page-title">Applied Content Forms</h1>
				{% endif %}
			</div>
		</header>

		<main class="page-content">
			<div class="inner">
				{% if page.title %}
				<h1>{{ page.title }}</h1>
				{% endif %}
				{{ content }}
			</div>
		</main>

		<footer class="page-footer">
			<div class="inner">
				{% if site.show_downloads %}
				<ul class="download-links">
					<li>
						<a href="{{ site.github.zip_url }}" id="download-zip" class="button"><span>Download .zip</span></a>
					</li>
					<li>
						<a href="{{ site.github.tar_url }}" id="download-tar-gz" class="button"><span>Download .tar.gz</span></a>
					</li>
				</ul>
				{% endif %}
			</div>
		</footer>
	</div>
</body>
</html>
