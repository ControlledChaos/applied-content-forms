<!DOCTYPE html>
<html class="no-js" lang="{{ site.lang | default: "en-US" }}" dir="auto">
<head>
	<meta charset='utf-8'>
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge">

	<script>(function(html){html.className = html.className.replace(/\bno-js\b/,'js')})(document.documentElement);</script>
	<link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

	{% seo %}
</head>
<body>
	<div id="{{ page.id }}" class="page-container">

		{% include_relative _partials/header.html %}

		<main class="page-content">
			<div class="inner">
				{{ content }}
			</div>
		</main>

		<footer class="page-footer">
			<div class="inner">
				{% if site.show_downloads %}
				<ul class="download-links">
					<li>
						<a href="{{ site.github.zip_url }}" id="download-zip" class="button"><span>Download .zip</span></a>
					</li>
					<li>
						<a href="{{ site.github.tar_url }}" id="download-tar-gz" class="button"><span>Download .tar.gz</span></a>
					</li>
				</ul>
				{% endif %}
			</div>
		</footer>
	</div>
</body>
</html>
