<header class="page-header">
	<div class="inner page-header-inner">
		<div class="page-nav-wrap">
			<nav class="page-nav">
				<ul>
					<li><a href="{{ '/features/' | relative_url }}">Features</a></li>
					<li><a href="{{ '/docs/' | relative_url }}">Docs</a></li>
					<li><a href="{{ site.github.repository_url }}">Code</a></li>
					<li><a href="{{ '/about/' | relative_url }}">About</a></li>
					<li><a href="{{ site.github.url }}">Home</a></li>
				</ul>
			</nav>
			<div id="header-action">
				{% unless site.github.latest_release %}
				<a href="{{ site.github.releases_url }}/latest/download/asset-name.zip" class="button button-featured"><span class="svg-icon inline-icon">{% include download.svg %}</span> Latest</a>
				{% endunless %}
			</div>
		</div>
		{% if page.title %}
		<p class="page-title">
			<a href="{{ site.github.url }}">Applied Content Forms</a>
		</p>
		{% else %}
		<h1 class="page-title">Applied Content Forms</h1>
		{% endif %}
	</div>
</header>
